<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPU scheduling | OS Algorithm Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
<a class="brand" href="index.html">OS Algorithm Lab</a>
<a class="l" href="cpu.html" aria-current="page">CPU scheduling</a>
<a class="l" href="banker.html">Banker’s algorithm</a>
<a class="l" href="page-replacement.html">Page replacement</a>
<a class="l" href="disk.html">Disk scheduling</a>
<button id="theme" aria-label="Toggle colour theme">Theme</button>
</header>
<main>
<h1>CPU scheduling</h1>
<p class="sub">Enter one process per line as name, arrival time, burst time, priority (lower number runs first).</p>
<div class="panel"><div class="grid">
<div class="wide"><label for="cIn">Processes</label><textarea id="cIn" rows="6">P1 0 8 3
P2 1 4 1
P3 2 9 4
P4 3 5 2</textarea></div>
<div><label for="cQ">Round robin quantum</label><input id="cQ" type="number" value="3" min="1"></div></div>
<div class="row"><button class="p" id="cRun">Run simulation</button></div><p class="err" id="cErr" role="alert"></p></div>
<div class="panel"><h2>Gantt chart</h2><div class="tabs" id="cTabs" role="tablist"></div><div class="scroll"><div id="cG"></div></div><div class="scroll" id="cT"></div></div>
<div class="panel"><h2>Performance comparison</h2><div class="scroll"><table id="cC"></table></div><div class="bars" id="cB"></div><p class="verdict" id="cV"></p></div>
</main>
<script src="js/common.js"></script>
<script src="js/cpu.js"></script>
</body>
</html>
